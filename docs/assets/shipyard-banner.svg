<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">Shipyard — Your Linux infrastructure, in one place.</title>
  <desc id="desc">A dark blue banner with the Shipyard mark and connected server outlines.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#101c32"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#2563eb" stop-opacity=".22"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="320" rx="18" fill="url(#background)"/>
  <ellipse cx="1020" cy="145" rx="350" ry="230" fill="url(#glow)"/>
