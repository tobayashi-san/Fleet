<!doctype html><html lang="en"><meta charset="utf-8"><div id="root"></div><script type="module">

let resolveIp,resolveAdopt,attempts=0;const json=(data,status=200)=>new Response(JSON.stringify(data),{status,headers:{'Content-Type':'application/json'}});window.fetch=async(url,init)=>{if(init.headers['X-Shipyard-Environment']!=='fixture')throw Error('Wrong environment');if(String(url).endsWith('/system/deploy')){const body=JSON.parse(init.body);if(body.server_id!=='new-host'||body.password!=='fixture-only')throw Error('Wrong key target');return json({success:false,error:'Fixture: SSH authentication rejected'});}if(String(url).includes('/servers/groups?'))return json([]);if(String(url).includes('/guest-ip?')){await new Promise(r=>resolveIp=r);return json({ip_address:'10.20.1.5'});}if(String(url).endsWith('/fixture/import-vm')&&init.method==='POST'){const data=JSON.parse(init.body);if(data.name!=='Preserved host'||data.ip_address!=='10.20.1.99'||data.vm_id!==101)throw Error('Wrong target/draft');if(++attempts>1)throw Error('Guest adopted twice');return json({server:{id:'new-host',ip_address:data.ip_address}});}throw Error('Unexpected fixture request');};
function Fixture(){const[open,setOpen]=React.useState(true);const[env,setEnv]=React.useState('fixture');const[name,setName]=React.useState('Original guest');React.useEffect(()=>{const handle=e=>{if(e.key==='F6')client.setQueryData(['profile'],{id:'operator',role:client.getQueryData(['profile']).role==='admin'?'user':'admin'});if(e.key==='F7'){resolveIp?.();setName('Refreshed guest');}if(e.key==='F8')setEnv(v=>v==='fixture'?'other':'fixture');if(e.key==='F9')resolveAdopt?.();};window.addEventListener('keydown',handle);return()=>window.removeEventListener('keydown',handle);},[]);return React.createElement(React.Fragment,null,React.createElement('h1',null,'Inventory'),React.createElement(ImportProxmoxVmDialog,{connectionId:'fixture',environmentId:env,vm:{name,node_name:'pve001',vm_id:101,guest_type:'qemu'},open,onOpenChange:setOpen}));}
const root=createRootRoute({component:Fixture});const router=createRouter({routeTree:root,history:createMemoryHistory({initialEntries:['/']})});const client=new QueryClient({defaultOptions:{queries:{retry:false},mutations:{retry:false}}});client.setQueryData(['profile'],{id:'operator',role:'user'});createRoot(document.getElementById('root')).render(React.createElement(QueryClientProvider,{client},React.createElement(RouterProvider,{router})));
</script></html>
