<!doctype html><html><meta charset="utf-8"><button id="fail">Simulate inventory failure</button><div id="root"></div><script type="module">
import React from'react';import{createRoot}from'react-dom/client';import{QueryClient,QueryClientProvider}from'@tanstack/react-query';import{PluginsTab}from'/src/routes/settings/tabs/plugins.tsx';import'/src/index.css';import'/src/lib/i18n.ts';
const plugins=[{id:'inventory',name:'Inventory helper',version:'1.0.0',packageStatus:{installedVersion:'2.0.0',loadedVersion:'1.0.0',state:'reload-required',checkedAt:Date.now(),rollback:'manual'},loaded:true,enabled:false},{id:'reports',name:'Reports',version:'2.0.0',loaded:false,enabled:false,error:'Runtime requirements not met',compatibility:{status:'incompatible',runtime:{node:'22.15.0',shipyard:'3.0.8-rc.26'},requirements:[{name:'node',range:'>=24',current:'22.15.0',matches:false},{name:'shipyard',range:'>=3.0.8-rc.26 <4',current:'3.0.8-rc.26',matches:true}]}}];

</script></html>
