  <text x="56" y="160" font-family="Arial, sans-serif" font-size="43" font-weight="700" fill="#f5f8ff">Your Linux infrastructure,</text>
  <text x="56" y="213" font-family="Arial, sans-serif" font-size="43" font-weight="700" fill="#f5f8ff">in one place.</text>
  <text x="58" y="265" font-family="Arial, sans-serif" font-size="17" fill="#a8b9d2">Hosts. Containers. Automation. Virtual machines.</text>
