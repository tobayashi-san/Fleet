window.fetch=async(url,init={})=>{const p=String(url);if(p.includes('/auth/profile'))return json({role:'reader',permissions:{canViewServerHistory:true}});if(p.includes('/settings'))return json({});if(p.includes('/history?')){const q=new URL(p,location.origin).searchParams;if(q.get('page')==='2')return json({error:'History temporarily unavailable'},503);const all=Array.from({length:26},(_,i)=>({id:i+1,action:i===25?'reboot':'system_update',status:i===25?'failed':'success',started_at:'2026-09-11 06:00:00',completed_at:'2026-09-11 06:01:00',output:i===25?'ERROR: Older restart failed':'Completed',triggered_by:'Alice'}));const filtered=all.filter(r=>(!q.get('action')||r.action===q.get('action'))&&(!q.get('status')||r.status===q.get('status')));const total_pages=Math.max(1,Math.ceil(filtered.length/25));const page=Math.min(Number(q.get('page')||1),total_pages);return json({items:filtered.slice((page-1)*25,page*25),actions:['reboot','system_update'],total_unfiltered:26,pagination:{page,total:filtered.length,total_pages}});}if(p.endsWith('/notes/history'))return json({revisions:[{...stored,created_at:stored.updated_at}]});if(p.endsWith('/notes')){if(init.method==='PUT'){const body=JSON.parse(init.body);if(body.revision!==stored.revision)return json({error:'Notes changed on server'},409);stored={...stored,notes:body.notes,revision:stored.revision+1,author:'Test operator'};}return json(stored);}if(p.endsWith('/info'))return json({});if(p==='/api/servers/a')return json({id:'a',name:'Notes host'});throw Error('Unexpected fixture request '+p);};
