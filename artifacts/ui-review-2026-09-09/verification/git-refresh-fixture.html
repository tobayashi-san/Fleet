<!doctype html><html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><div id="root"></div><script type="module">
import React from'react';import{createRoot}from'react-dom/client';import{QueryClient,QueryClientProvider}from'@tanstack/react-query';import{createRootRoute,createRouter,createMemoryHistory,RouterProvider}from'@tanstack/react-router';import{GitTab}from'/src/routes/settings/tabs/git.tsx';import'/src/index.css';import'/src/lib/i18n.ts';
let attempts=0;let updated=false;
window.fetch=async(url,options={})=>{
 if(url==='/api/playbooks-git/config')return Response.json({repoUrl:'https://example.test/team/playbooks.git',branch:'main',readOnly:true,autoPull:false,autoPush:false,hasToken:true});
 if(url==='/api/playbooks-git/status')return Response.json({initialized:true,branch:'main',revision:'abcdef123456789',changed:[],conflicts:[],comparison:{state:updated?'behind':'aligned',ahead:0,behind:updated?3:0},lastFetchAt:updated?'2026-09-10T06:00:00Z':'2026-09-09T06:00:00Z'});

 if(url==='/api/playbooks-git/fetch'&&options.method==='POST'){attempts++;if(attempts===1)return Response.json({error:'Repository temporarily unavailable'},{status:502});updated=true;return Response.json({success:true});}
 throw Error('Unexpected request '+url);
};

createRoot(document.getElementById('root')).render(React.createElement(QueryClientProvider,{client:new QueryClient({defaultOptions:{queries:{retry:false},mutations:{retry:false}}})},React.createElement(RouterProvider,{router})));
</script></html>
