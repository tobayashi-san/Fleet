<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head><body><div id="root"></div><script type="module">
import React from 'react';
import {createRoot} from 'react-dom/client';
import {QueryClient,QueryClientProvider} from '@tanstack/react-query';
import {createRouter,createRootRoute,RouterProvider} from '@tanstack/react-router';
import {TemplatesTab} from '/src/features/playbooks/PlaybookTemplates.tsx';
import '/src/lib/i18n.ts';
import '/src/index.css';
let revision='1'.repeat(64);
let content='---\n- name: Inspect host\n  hosts: all\n  tasks:\n    - name: Show status\n      ansible.builtin.debug:\n        msg: Ready\n';
window.fetch=async (url,init)=>{
 const endpoint=String(url);
 if(init?.method==='POST' && endpoint.endsWith('/playbooks')) { content=JSON.parse(init.body).content; revision='2'.repeat(64); }
 const data=endpoint.includes('/profile')?{role:'admin',permissions:{full:true}}:endpoint.endsWith('/playbooks')?(init?.method==='POST'?{filename:'inspect.yml',revision}:[{filename:'inspect.yml',description:'Inspect host',category:'Operations'},{filename:'second.yml',description:'Second runbook',category:'Operations'}]):endpoint.includes('/history')?[]:{content,revision};
 return new Response(JSON.stringify(data),{status:200,headers:{'Content-Type':'application/json'}});
};
const client=new QueryClient({defaultOptions:{queries:{retry:false}}});
const route=createRootRoute({component:()=>React.createElement('main',{style:{maxWidth:1050,margin:'24px auto',padding:24}},React.createElement('h1',null,'Playbooks · local review fixture'),React.createElement('button',{onClick:()=>client.setQueryData(['profile'],{role:'reader',permissions:{canViewPlaybooks:true}})},'Use reader permissions'),React.createElement(TemplatesTab,{onRun:()=>{}}))});
const router=createRouter({routeTree:route});
createRoot(document.getElementById('root')).render(React.createElement(QueryClientProvider,{client},React.createElement(RouterProvider,{router})));
</script></body></html>
