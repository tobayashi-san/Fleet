localStorage.setItem('shipyard_environment','fixture');useUi.setState({environmentId:'fixture'});const json=data=>new Response(JSON.stringify(data),{headers:{'Content-Type':'application/json'}});const profile={role:'operator',permissions:{canViewInfrastructure:true,canViewAudit:true}};
