<!doctype html><html><meta charset="utf-8"><title>Reset backup review fixture</title><div style="padding:12px"><strong>Isolated UI fixture — no live API requests</strong> <button id="archive">Select synthetic saved archive</button></div><div id="root"></div><script type="module">
import React from 'react';import{createRoot}from'react-dom/client';import{DangerTab}from'/src/routes/settings/tabs/danger.tsx';import{useUi}from'/src/lib/store';import'/src/index.css';import'/src/lib/i18n.ts';
useUi.setState({environmentId:'review-environment'});
document.getElementById('archive').onclick=()=>{const input=document.querySelector('input[type=file]');if(!input)return;const transfer=new DataTransfer();transfer.items.add(new File(['Synthetic encrypted archive fixture'],'saved.backup',{type:'application/octet-stream'}));input.files=transfer.files;input.dispatchEvent(new Event('change',{bubbles:true}));};
let failures=0;
window.fetch=async(url,options={})=>{
 if(options.headers?.['X-Shipyard-Environment']!=='review-environment')return Response.json({error:'Wrong environment'},{status:409});
 if(options.method==='POST' && String(url).endsWith('/backup'))return Response.json({id:'fixture-upload'});
 if(options.method==='PUT'){
  if(!(options.body instanceof Blob))return Response.json({error:'Archive bytes were not uploaded'},{status:400});
  return Response.json({id:'fixture-approval',expiresAt:new Date(Date.now()+300000).toISOString()});
 }
 if(options.method==='DELETE'){
  if(JSON.parse(options.body).backupApproval!=='fixture-approval')return Response.json({error:'Missing backup approval'},{status:409});
  if(!failures++)return Response.json({error:'Reset data changed after backup verification. Create and verify a current backup before trying again.',field:'backup'},{status:409});
  return Response.json({success:true});
 }
 return Response.json({});
};
createRoot(document.getElementById('root')).render(React.createElement('main',{style:{padding:24,maxWidth:1100,margin:'auto'}},React.createElement(DangerTab)));
</script></html>
