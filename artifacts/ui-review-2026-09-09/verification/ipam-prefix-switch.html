<!doctype html><html><meta charset="utf-8"><div id="root"></div><script type="module">
import React from'react';import{createRoot}from'react-dom/client';import{createRootRoute,createRoute,createRouter,createMemoryHistory,RouterProvider,Outlet}from'@tanstack/react-router';import{QueryClient,QueryClientProvider}from'@tanstack/react-query';import{NetworkDetailPage}from'/src/routes/network-detail.tsx';import'/src/index.css';import'/src/lib/i18n.ts';
const prefix={id:'fixture',environment_id:'default',name:'Review prefix',cidr:'192.0.2.0/24',status:'active',child_prefix_count:0,usable_address_count:254,used_address_count:0,free_address_count:254,reservation_count:0,range_count:0,next_free_address:'192.0.2.1'};
let attempted=false;
window.fetch=async(url,options)=>{if(url.includes('/profile'))return Response.json({role:'admin',username:'review',capabilities:{}});if(url.includes('/reservations/validate') && url.includes('/fixture/') && !window.switched){window.switched=true;setTimeout(()=>router.navigate({to:'/networks/$id',params:{id:'second'}}),5000);}if(url.includes('/reservations/validate'))return Response.json({valid:!attempted,message:attempted?'Address is already reserved.':`Address is available in ${url.includes('/second/')?'198.51.100.0/24':'192.0.2.0/24'}`});if(url.endsWith('/reservations')&&options?.method==='POST'){attempted=true;await new Promise(r=>setTimeout(r,15000));return Response.json({error:'Fixture: address was reserved concurrently; choose another address.'},{status:409});}if(url.includes('/allocations'))return Response.json({items:[],page:1,page_size:50,total:0,total_pages:1,free_segments:[]});if(url.endsWith('/subnets/fixture'))return Response.json(prefix);if(url.endsWith('/subnets/second'))return Response.json({...prefix,id:'second',name:'Second prefix',cidr:'198.51.100.0/24',next_free_address:'198.51.100.1'});if(url.includes('/conflicts')||url.includes('/children')||url.includes('/servers')||url.includes('/proxmox-connections'))return Response.json([]);throw Error('Unexpected fixture request '+url);};
const root=createRootRoute({component:Outlet});const route=createRoute({getParentRoute:()=>root,path:'networks/$id',component:NetworkDetailPage});const router=createRouter({routeTree:root.addChildren([route]),history:createMemoryHistory({initialEntries:['/networks/fixture']})});const client=new QueryClient({defaultOptions:{queries:{retry:false}}});createRoot(document.getElementById('root')).render(React.createElement(QueryClientProvider,{client},React.createElement(RouterProvider,{router})));
</script></html>
