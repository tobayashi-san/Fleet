<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head><body><div id="root"></div><script type="module">
import React from 'react';
import {createRoot} from 'react-dom/client';
import {QueryClient,QueryClientProvider} from '@tanstack/react-query';
import {VmFormDialog} from '/src/features/deployments/VmFormDialog.tsx';
import '/src/index.css';
const catalog={node:'pve001',next_vm_id:120,nodes:[{name:'pve001',online:true}],templates:[{name:'Debian 13',vm_id:9000}],datastores:[{id:'local-lvm'}],bridges:[{name:'vmbr0',source:'node'}]};
window.fetch=async (url,init)=>new Response(JSON.stringify(String(url).includes('catalog')?catalog:String(url).includes('vm-templates')?{templates:[]}:[]),{status:200,headers:{'Content-Type':'application/json'}});
const client=new QueryClient({defaultOptions:{queries:{retry:false}}});
function App(){const[vm,setVm]=React.useState({id:'vm-fixture',name:'original-vm',node_name:'pve001',vm_id:120,clone_vm_id:9000,username:'debian'});React.useEffect(()=>{let timer;const change=()=>{clearTimeout(timer);timer=setTimeout(()=>setVm(current=>({...current,name:'changed-on-server'})),1500);};window.addEventListener('input',change,{once:true});return()=>{clearTimeout(timer);window.removeEventListener('input',change);};},[]);return React.createElement(VmFormDialog,{open:true,onOpenChange:()=>{},vmId:vm.id,initialVm:vm,environmentId:'default',connectionId:'fixture'});}
createRoot(document.getElementById('root')).render(React.createElement(QueryClientProvider,{client},React.createElement(App)));
</script></body></html>
