<!doctype html><html><div id="root"></div><script type="module">
import React from'react';import{createRoot}from'react-dom/client';import{createRootRoute,createRoute,createRouter,RouterProvider,createMemoryHistory,Link}from'@tanstack/react-router';import{QueryClient,QueryClientProvider}from'@tanstack/react-query';import{ServerDetailPage}from'/src/features/server-detail/ServerDetailPage.tsx';import{api}from'/src/lib/api.ts';import{ws}from'/src/lib/ws.ts';import'/src/index.css';import'/src/lib/i18n.ts';
ws.connect=()=>{};ws.subscribe=()=>()=>{};const h=React.createElement;let release=()=>{};
api.getCachedImageUpdates=async id=>({results:[{container_name:'web',image:'example:latest',status:'update_available'}],updated_at:'2026-09-11T08:00:00Z',source:'Registry digest comparison over SSH',stale:false});api.checkImageUpdates=async id=>new Promise(resolve=>{release=()=>resolve([{image:id+'-delayed',status:'unknown'}]);});api.getServerDocker=async()=>[{container_name:'web',image:'example:latest',status:'Up 1 hour',compose_project:'review-stack',compose_working_dir:'/opt/review-stack'}];api.getDockerCompose=async()=>({content:'services:\n  web:\n    image: example:latest\n'});api.writeDockerCompose=async(host,dir,content)=>{window.lastComposeSave={host,dir,content};return {success:true};};

const root=createRootRoute();const page=createRoute({getParentRoute:()=>root,path:'/servers/$id',component:App});const router=createRouter({routeTree:root.addChildren([page]),history:createMemoryHistory({initialEntries:['/servers/a#tab=docker']})});createRoot(document.getElementById('root')).render(h(QueryClientProvider,{client:new QueryClient({defaultOptions:{queries:{retry:false}}})},h(RouterProvider,{router})));
