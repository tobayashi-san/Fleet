name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without leading v, for example 1.1.2-rc.1 or 1.1.2'
        required: true
        type: string
      release_notes:
        description: 'Optional release notes. Leave empty to use the CHANGELOG.md section for this version.'
        required: false
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  FLEET_E2E_OUTPUT_DIR: ${{ github.workspace }}/artifacts/browser/results
  FLEET_E2E_ARTIFACT_DIR: ${{ github.workspace }}/artifacts/browser/screenshots
  FLEET_E2E_REPORT_DIR: ${{ github.workspace }}/artifacts/browser/report
  VERSION: ${{ inputs.version }}

jobs:
  validate:
    name: Validate release input
    runs-on: ubuntu-latest
    outputs:
      is_rc: ${{ steps.version.outputs.is_rc }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Validate version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Releases must be dispatched from the main branch" >&2
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "Version must look like 1.2.3 or 1.2.3-rc.1" >&2
            exit 1
          fi
          if [[ "$VERSION" == v* ]]; then
            echo "Version input must not start with v" >&2
            exit 1
          fi
          if [[ "$VERSION" == *"-rc."* ]]; then
            echo "is_rc=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_rc=false" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Require changelog entry
        run: node tools/release-notes.mjs "$VERSION" > /dev/null

  backend-tests:
    name: Backend tests
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install backend dependencies
        working-directory: server
        run: npm ci

      - name: Verify backend
        working-directory: server
        run: npm run check

      - name: Audit backend dependencies, including test tools
        working-directory: server
        run: npm audit

  frontend-build:
    name: Frontend build
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend-next/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend-next
        run: npm ci

      - name: Install backend dependencies for browser tests
        working-directory: server
        run: npm ci

      - name: Verify frontend
        working-directory: frontend-next
        run: |
          npx playwright install --with-deps firefox
          npm run check

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-failure-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/browser/
          if-no-files-found: ignore
          retention-days: 14

      - name: Audit frontend dependencies, including build tools
        working-directory: frontend-next
        run: npm audit

  docker-build:
    name: Docker build
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: fleet:release-check

      - name: Smoke-test production container
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker logs fleet-smoke || true; docker rm -f fleet-smoke >/dev/null 2>&1 || true' EXIT
          docker run -d --name fleet-smoke \
            -e JWT_SECRET=release-smoke-jwt-secret-000000000000 \
            -e FLEET_KEY_SECRET=release-smoke-key-secret-0000000000 \
            -p 127.0.0.1:8443:8443 fleet:release-check
          for attempt in {1..30}; do
            if curl --fail --silent --insecure https://127.0.0.1:8443/api/health >/dev/null; then break; fi
            if [[ "$attempt" == 30 ]]; then exit 1; fi
            sleep 1
          done
          docker restart fleet-smoke >/dev/null
          for attempt in {1..30}; do
            if curl --fail --silent --insecure https://127.0.0.1:8443/api/health >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1

      - name: Check container configuration and recovery
        run: node tools/test-container.mjs fleet:release-check

  release-rc:
    name: Publish RC release
    if: needs.validate.outputs.is_rc == 'true'
    needs:
      - validate
      - backend-tests
      - frontend-build
      - docker-build
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Ensure tag does not exist
        run: |
          if git rev-parse "${{ needs.validate.outputs.tag }}" >/dev/null 2>&1; then
            echo "Tag ${{ needs.validate.outputs.tag }} already exists" >&2
            exit 1
          fi

      - name: Set package versions
        run: node tools/set-version.mjs "$VERSION"

      - name: Commit and tag release
        run: |
          git add package.json package-lock.json server/package.json server/package-lock.json frontend-next/package.json frontend-next/package-lock.json
          git commit -m "chore(release): ${{ needs.validate.outputs.tag }}"
          git tag -a "${{ needs.validate.outputs.tag }}" -m "Fleet ${{ needs.validate.outputs.tag }}"
          git push origin HEAD:main
          git push origin "${{ needs.validate.outputs.tag }}"

      - name: Create release notes
        env:
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          if [[ -n "$RELEASE_NOTES" ]]; then
            printf '%s\n' "$RELEASE_NOTES" > release-notes.md
          else
            node tools/release-notes.mjs "$VERSION" > release-notes.md
          fi

      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ needs.validate.outputs.tag }}" --title "Fleet ${{ needs.validate.outputs.tag }}" --notes-file release-notes.md --prerelease

      - name: Start Docker publish workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run docker-publish.yml --ref "${{ needs.validate.outputs.tag }}"

  release-stable:
    name: Publish stable release
    if: needs.validate.outputs.is_rc == 'false'
    needs:
      - validate
      - backend-tests
      - frontend-build
      - docker-build
    runs-on: ubuntu-latest
    environment: stable-release
    permissions:
      actions: write
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Ensure tag does not exist
        run: |
          if git rev-parse "${{ needs.validate.outputs.tag }}" >/dev/null 2>&1; then
            echo "Tag ${{ needs.validate.outputs.tag }} already exists" >&2
            exit 1
          fi

      - name: Set package versions
        run: node tools/set-version.mjs "$VERSION"

      - name: Commit and tag release
        run: |
          git add package.json package-lock.json server/package.json server/package-lock.json frontend-next/package.json frontend-next/package-lock.json
          git commit -m "chore(release): ${{ needs.validate.outputs.tag }}"
          git tag -a "${{ needs.validate.outputs.tag }}" -m "Fleet ${{ needs.validate.outputs.tag }}"
          git push origin HEAD:main
          git push origin "${{ needs.validate.outputs.tag }}"

      - name: Create release notes
        env:
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          if [[ -n "$RELEASE_NOTES" ]]; then
            printf '%s\n' "$RELEASE_NOTES" > release-notes.md
          else
            node tools/release-notes.mjs "$VERSION" > release-notes.md
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ needs.validate.outputs.tag }}" --title "Fleet ${{ needs.validate.outputs.tag }}" --notes-file release-notes.md

      - name: Start Docker publish workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run docker-publish.yml --ref "${{ needs.validate.outputs.tag }}"
